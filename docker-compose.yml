version: '3.8'

services:
  # MongoDB
  mongo:
    image: mongo:7
    container_name: wardrobe_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: smart_wardrobe
    networks:
      - wardrobe_net

  # Backend API
  backend:
    build: ./backend
    container_name: wardrobe_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/smart_wardrobe
      JWT_SECRET: ${JWT_SECRET:-your_super_secret_key_change_this}
      JWT_EXPIRE: 30d
      CLIENT_URL: http://localhost:3000
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    depends_on:
      - mongo
    volumes:
      - uploads_data:/app/uploads
    networks:
      - wardrobe_net

  # Frontend React App
  frontend:
    build: ./frontend
    container_name: wardrobe_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - wardrobe_net

volumes:
  mongo_data:
  uploads_data:

networks:
  wardrobe_net:
    driver: bridge
