name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show repository structure
        run: |
          echo "Top-level files and folders:"
          ls -la
          echo ""
          echo "Backend folder:"
          ls -la backend
          echo ""
          echo "Frontend folder:"
          ls -la frontend

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          rm -rf node_modules
          npm ci
        working-directory: backend

      - name: Run Backend Tests
        run: npm test --if-present
        working-directory: backend

      - name: Install Frontend Dependencies
        run: |
          rm -rf node_modules
          npm install
        working-directory: frontend

      - name: Build React App
        env:
          NODE_OPTIONS: --max_old_space_size=4096
          GENERATE_SOURCEMAP: "false"
          CI: "false"
        run: |
          chmod +x node_modules/.bin/react-scripts || true
          npm run build
        working-directory: frontend

  deploy-render:
    name: Deploy to Render
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK is not set in repository secrets"
            exit 1
          fi

          curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
          echo "Render deploy triggered successfully"
